server:
  port: ${ORDER_SERVICE_PORT}

grpc:
  server:
    user-service:
      url: ${USER_SERVICE_GRPC_URL}
      port: ${USER_SERVICE_GRPC_PORT}
    post-service:
      url: ${POST_SERVICE_GRPC_URL}
      port: ${POST_SERVICE_GRPC_PORT}

spring:
  application:
    name: order-service
  profiles:
    active: ${ORDER_SERVICE_PROFILE}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      driver-class-name: "org.postgresql.Driver"

  jpa:
    generate-ddl: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: "user_post_storage"

  kafka:
    topics:
      order-topic: "order-topic"
    producer:
      bootstrap-servers: ${KAFKA_BROKER_HOST}:${KAFKA_BROKER_PORT}
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
        enable.idempotence: true
        spring.json.type.mapping: >
          orderCreated:org.serious.dev.kafka.event.OrderCreatedEvent,
          orderFailed:org.serious.dev.kafka.event.OrderFailedEvent
